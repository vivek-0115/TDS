services:
  - type: web
    name: tds-project-1-bot
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_BASE_URL
        value: https://aipipe.org/openai/v1
      - key: OPENAI_MODEL
        value: gpt-4o
      - key: LOG_URL_BASE
        sync: false
